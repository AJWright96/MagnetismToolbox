[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "MagnetismToolbox"
version = "0.1.0"
description = "Toolbox of helper codes for magnetism measurements and MuMax simulations"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["MagnetismToolbox"]